<div class="side-menu-container" [class.collapsed]="collapsed" [class.mobile-view]="mobileView">
  @if (mobileView) {
    <button class="close-menu-btn" (click)="onClose.emit()">
      <i class="bi bi-x-lg"></i>
    </button>
  }
  <div class="side-menu-scroll">
    <ul class="nav flex-column">
      @for (item of menuItems; track item) {
        <li class="nav-item">
          <a class="nav-link" (click)="toggleSubMenu(item)">
            <i class="bi" [class]="item.icon"></i>
            <span class="menu-text">{{ item.text }}</span>
            @if (item.children?.length) {
              <i class="bi bi-chevron-left submenu-indicator"
              [class.rotated]="item.expanded"></i>
            }
          </a>
          @if (item.children?.length && item.expanded) {
            <ul class="sub-menu">
              @for (child of item.children; track child) {
                <li>
                  <a class="nav-link" (click)="toggleSubMenu(child)">{{ child.text }}</a>
                </li>
              }
            </ul>
          }
        </li>
      }
    </ul>
  </div>
</div>
